<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مصمم البيوت ثلاثي الأبعاد</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1621;--panel:rgba(252,253,254,.86);--solid:#fbfcfd;--ink:#18222f;--mut:#617085;--line:rgba(30,45,65,.14);--acc:#0e7c86;--acc-ink:#ffffff;--hi:#e89a2b;--chip:rgba(30,50,75,.07);--card:rgba(255,255,255,.72);--shadow:0 14px 40px rgba(12,22,38,.3)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--panel:rgba(20,28,40,.82);--solid:#171e28;--ink:#e8edf3;--mut:#9fb0c3;--line:rgba(255,255,255,.11);--acc:#2cc4cf;--acc-ink:#06232a;--hi:#f2b04a;--chip:rgba(255,255,255,.07);--card:rgba(255,255,255,.05);--shadow:0 14px 40px rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--panel:rgba(20,28,40,.82);--solid:#171e28;--ink:#e8edf3;--mut:#9fb0c3;--line:rgba(255,255,255,.11);--acc:#2cc4cf;--acc-ink:#06232a;--hi:#f2b04a;--chip:rgba(255,255,255,.07);--card:rgba(255,255,255,.05);--shadow:0 14px 40px rgba(0,0,0,.55)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;background:var(--bg)}
@media (orientation:portrait) and (pointer:coarse){#app{position:fixed;left:0;top:0;width:100vh;width:100dvh;height:100vw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg)}}
header.top{display:flex;align-items:center;gap:6px;padding:7px 12px;background:var(--solid);border-bottom:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:none;z-index:30;position:relative}
header.top::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;white-space:nowrap;margin-inline-end:10px}
.brand svg{width:30px;height:30px;flex:none}
.brand small{font-size:11px;background:linear-gradient(135deg,var(--hi),#f5c46b);color:#2a1a00;border-radius:7px;padding:1px 7px;font-weight:800}
.tb{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 13px;white-space:nowrap;font-size:14px;min-height:36px;transition:background .15s,border-color .15s}
.tb:hover{border-color:var(--acc);background:var(--card)}
.tb:active{transform:scale(.97)}
.tb:focus-visible,.card:focus-visible,.chip2:focus-visible,.sw:focus-visible,.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
main{flex:1;position:relative;min-height:0}
#view{position:absolute;inset:0;background:#9ec4e6;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.side{position:absolute;top:12px;bottom:12px;width:296px;background:var(--panel);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;z-index:10}
#catalog{right:12px}
#props{left:12px;width:274px}
.side.hide{display:none}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;border:0;background:none;padding:9px 4px;font-weight:700;color:var(--mut);border-radius:13px;transition:background .15s,color .15s}
.tabs button.on{background:var(--acc);color:var(--acc-ink)}
.tp{flex:1;overflow:auto;padding:12px;min-height:0;scrollbar-width:thin}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip2{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 13px;white-space:nowrap;font-size:13px;transition:background .15s}
.chip2.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
#q{width:100%;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:12px;padding:9px 12px;font:inherit;margin-bottom:12px}
#q:focus{outline:2px solid var(--acc);outline-offset:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.card{border:1px solid var(--line);background:var(--card);border-radius:15px;padding:6px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;font-size:13px;line-height:1.25;font-weight:500;transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);border-color:var(--acc);box-shadow:0 8px 20px rgba(0,0,0,.16)}
.card:active{transform:scale(.97)}
.card img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:11px;background:radial-gradient(circle at 50% 30%,#f9fbfd,#c3d2e2)}
.card img:not([src]){visibility:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:10px 0;font-size:13px;align-items:center}
.row input[type=range]{grid-column:1/-1;width:100%}
.row b{color:var(--acc);font-weight:800}
input[type=range]{-webkit-appearance:none;appearance:none;height:22px;background:transparent;accent-color:var(--acc)}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--acc);border:3px solid var(--solid);margin-top:-7px;box-shadow:0 1px 5px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--acc);border:3px solid var(--solid)}
h4{margin:16px 0 7px;font-size:13px;color:var(--mut);font-weight:700}
.pal{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pal i{width:23px;height:23px;border-radius:50%;border:2px solid var(--solid);box-shadow:0 0 0 1px rgba(0,0,0,.2);cursor:pointer;display:block;transition:transform .12s}
.pal i:hover{transform:scale(1.18)}
.pal input[type=color]{width:32px;height:28px;border:1px solid var(--line);padding:0;background:none;border-radius:8px}
.swg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.sw{border:2px solid transparent;border-radius:12px;padding:0;background:var(--card);overflow:hidden;font-size:11px;transition:transform .12s}
.sw:hover{transform:translateY(-1px)}
.sw.on{border-color:var(--hi)}
.sw img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.sw span{display:block;padding:3px 2px}
.chk{display:flex;gap:9px;align-items:center;margin:9px 0;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--acc)}
.btns{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--chip);border-radius:12px;padding:8px 12px;font-size:13px;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
.btn.dng{color:#d6403a;border-color:#d6403a55}
.ph{display:flex;gap:9px;align-items:center;font-size:18px;margin-bottom:4px}
.ph span{font-size:24px}
.dim{font-size:12px;color:var(--mut)}
.empty{color:var(--mut);font-size:14px;line-height:1.85}
.empty b{color:var(--ink)}
.num{width:100%;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:6px;font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpl{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:11px;width:100%;text-align:start;margin-bottom:9px;transition:transform .15s,border-color .15s}
.tpl:hover{border-color:var(--acc);transform:translateY(-1px)}
.tpl i{font-style:normal;font-size:28px;width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,var(--acc),var(--hi));flex:none}
.tpl small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.seg{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:4px;box-shadow:var(--shadow);z-index:11}
.seg button{border:0;background:none;padding:8px 14px;border-radius:12px;font-size:14px;font-weight:700;white-space:nowrap;transition:background .15s}
.seg button.on{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 70%,#fff));color:var(--acc-ink)}
#hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(12,20,32,.66);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;padding:6px 14px;border-radius:999px;font-size:12px;max-width:min(92%,430px);text-align:center;pointer-events:none;z-index:9}
#fab{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);display:flex;gap:5px;background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:5px;box-shadow:var(--shadow);z-index:11}
#fab button{border:0;background:var(--chip);border-radius:13px;width:44px;height:42px;font-size:19px;transition:background .15s,transform .12s}
#fab button:hover{background:var(--card)}
#fab button:active{transform:scale(.92)}
#joy{position:absolute;bottom:64px;left:24px;width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.55);z-index:9;touch-action:none;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.88);transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.3)}
#toast{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--solid);padding:9px 18px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:40;max-width:90%;text-align:center}
#toast.on{opacity:1}
#modal{position:fixed;inset:0;background:rgba(5,10,18,.62);display:grid;place-items:center;z-index:60;padding:16px}
#modal .box{background:var(--solid);border-radius:20px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:20px;box-shadow:var(--shadow)}
#modal h3{margin:0 0 10px}
#modal textarea{width:100%;height:200px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:8px;font:12px monospace;direction:ltr}
#modal img{max-width:100%;border-radius:12px}
#modal ul{padding-inline-start:20px;line-height:1.9;font-size:14px;margin:0}
.mob{display:none}
@media (max-width:1000px){
 .mob{display:inline-block}
 .side{width:min(86vw,320px);transition:transform .24s;top:8px;bottom:8px}
 #catalog{right:8px;transform:translateX(120%)}#catalog.open{transform:none}
 #props{left:8px;transform:translateX(-120%)}#props.open{transform:none}
 .side.hide{display:flex}
 .seg{top:10px}.seg button{padding:7px 10px;font-size:13px}
 #fab{bottom:50px}
}
@media (prefers-reduced-motion:reduce){.side,#toast,.card,.tpl,.sw{transition:none}}
</style>
</head>
<body>
<div id="app">
<header class="top">
 <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 15.5 16 5l12 10.5V27a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z" fill="#0e7c86"/><path d="M16 5 4 15.5l3 1.6L16 9.4l9 7.7 3-1.6z" fill="#e89a2b"/><rect x="13" y="17" width="6" height="11" rx="1" fill="#fbfcfd"/><rect x="7" y="17" width="4" height="4" rx=".6" fill="#bfe6ea"/><rect x="21" y="17" width="4" height="4" rx=".6" fill="#bfe6ea"/></svg>مصمم البيوت <small>3D</small></div>
 <button class="tb" id="bCat">📦 العناصر</button>
 <span class="sep"></span>
 <button class="tb" id="bUndo" title="تراجع (Ctrl+Z)">↶ تراجع</button>
 <button class="tb" id="bRedo" title="إعادة (Ctrl+Y)">↷ إعادة</button>
 <span class="sep"></span>
 <button class="tb" id="bNight" title="نهار / ليل (N)">🌙 ليل</button>
 <button class="tb" id="bShot">📷 صورة</button>
 <button class="tb" id="bIO">💾 حفظ / تصدير</button>
 <button class="tb" id="bTheme">◐ المظهر</button>
 <button class="tb" id="bFull" title="ملء الشاشة وقفل الوضع الأفقي">⛶ ملء الشاشة</button>
 <button class="tb" id="bHelp">❓ مساعدة</button>
 <button class="tb" id="bProps">⚙️ الخصائص</button>
</header>
<main>
 <aside id="catalog" class="side">
  <div class="tabs" id="mainTabs"><button data-t="items" class="on">العناصر</button><button data-t="house">المنزل</button><button data-t="tpl">قوالب جاهزة</button></div>
  <div class="tp" id="tabItems"><div class="chips" id="cats"></div><input id="q" type="search" placeholder="ابحث عن قطعة… (كنب، سرير، ثريا)"><div class="grid" id="grid"></div></div>
  <div class="tp" id="tabHouse" hidden></div>
  <div class="tp" id="tabTpl" hidden></div>
 </aside>
 <section id="view">
  <canvas id="c" tabindex="0"></canvas>
  <div class="seg" id="modes"><button data-m="orbit" class="on">🏠 عرض خارجي</button><button data-m="top">📐 مخطط علوي</button><button data-m="walk">🚶 جولة داخلية</button></div>
  <div id="toast"></div>
  <div id="fab" hidden><button data-a="rot" title="تدوير 45°">⟳</button><button data-a="dup" title="تكرار">⧉</button><button data-a="focus" title="تقريب">🔍</button><button data-a="walk" title="شاهد من هنا">🚶</button><button data-a="props" class="mob" title="الخصائص">⚙️</button><button data-a="del" title="حذف">🗑</button></div>
  <div id="joy" hidden><i id="joyk"></i></div>
  <div id="hint"></div>
 </section>
 <aside id="props" class="side"><div class="tabs"><button class="on">الخصائص والتعديل</button></div><div class="tp" id="propsBody"></div></aside>
</main>
<div id="modal" hidden><div class="box" id="modalBox"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){document.body.innerHTML='<p style="padding:40px;font:18px sans-serif">تعذّر تحميل مكتبة الرسوم ثلاثية الأبعاد. تأكد من الاتصال بالإنترنت ثم أعد المحاولة.</p>';return}
const PI=Math.PI,$=s=>document.querySelector(s);
const rotMQ=matchMedia('(orientation: portrait) and (pointer: coarse)');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const rnd=seed=>{let s=(seed|0)||1;return()=>{s=(Math.imul(s,1664525)+1013904223)|0;return((s>>>0)%100000)/100000}};
const shade=(hex,a)=>{const c=new THREE.Color(hex),h={};c.getHSL(h);c.setHSL(h.h,h.s,clamp(h.l+a,0,1));return'#'+c.getHexString()};

/* ---------- renderer / scene ---------- */
const canvas=$('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,1,.05,500);camera.rotation.order='YXZ';
const hemi=new THREE.HemisphereLight('#ffffff','#8d8678',.7);scene.add(hemi);
const amb=new THREE.AmbientLight('#ffffff',.15);scene.add(amb);
const sun=new THREE.DirectionalLight('#fff6e8',.9);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0005;sun.shadow.normalBias=.02;scene.add(sun);scene.add(sun.target);
const shell=new THREE.Group();scene.add(shell);
const walls=[];let shellCeil=null,groundMat=null;
scene.fog=new THREE.Fog('#d4e9f8',50,220);
const skyGeo=new THREE.SphereGeometry(400,24,16);skyGeo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(skyGeo.attributes.position.count*3),3));
const skyMesh=new THREE.Mesh(skyGeo,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false,depthWrite:false}));skyMesh.frustumCulled=false;skyMesh.renderOrder=-10;scene.add(skyMesh);
function paintSky(top,hor){const p=skyGeo.attributes.position,c=skyGeo.attributes.color,t=new THREE.Color();for(let i=0;i<p.count;i++){const y=clamp(p.getY(i)/400,0,1);t.copy(hor).lerp(top,Math.pow(y,.55));c.setXYZ(i,t.r,t.g,t.b)}c.needsUpdate=true}
const stars=(function(){const n=500,pp=new Float32Array(n*3),R=rnd(5);for(let i=0;i<n;i++){const u=R()*2-1,a=R()*PI*2,sq=Math.sqrt(1-u*u);pp[i*3]=Math.cos(a)*sq*380;pp[i*3+1]=Math.abs(u)*380+10;pp[i*3+2]=Math.sin(a)*sq*380}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pp,3));const st=new THREE.Points(g,new THREE.PointsMaterial({color:'#ffffff',size:2,sizeAttenuation:false,transparent:true,opacity:0,fog:false,depthWrite:false}));st.frustumCulled=false;scene.add(st);return st})();
const cloudMat=new THREE.MeshBasicMaterial({color:'#ffffff',transparent:true,opacity:.92,fog:false,depthWrite:false});
const clouds=new THREE.Group();(function(){const R=rnd(77);for(let i=0;i<14;i++){const c=new THREE.Group(),a=R()*PI*2,r=90+R()*160;c.position.set(Math.cos(a)*r,45+R()*40,Math.sin(a)*r);for(let k=0;k<5;k++){const m=new THREE.Mesh(new THREE.SphereGeometry(9+R()*8,10,8),cloudMat);m.position.set((k-2)*11+R()*6,R()*4,R()*8);m.scale.y=.45;c.add(m)}clouds.add(c)}})();scene.add(clouds);
const sunDisc=new THREE.Mesh(new THREE.SphereGeometry(14,16,12),new THREE.MeshBasicMaterial({color:'#fff2c4',fog:false}));sunDisc.frustumCulled=false;scene.add(sunDisc);const sunDir=new THREE.Vector3(0,1,0);

/* ---------- materials ---------- */
const MC=new Map();
function M(color,o){o=o||{};const r=o.r===undefined?.65:o.r,m=o.m||0,ei=o.ei===undefined?1:o.ei,op=o.op===undefined?1:o.op;const k=color+'|'+r+'|'+m+'|'+(o.e||'')+'|'+ei+'|'+op;let x=MC.get(k);if(!x){x=new THREE.MeshStandardMaterial({color:color,roughness:r,metalness:m});if(o.e){x.emissive=new THREE.Color(o.e);x.emissiveIntensity=ei}if(op<1){x.transparent=true;x.opacity=op;x.depthWrite=false}MC.set(k,x)}return x}
const PANE=new THREE.MeshStandardMaterial({color:'#cfe8ff',emissive:'#9fd0ff',emissiveIntensity:.9,roughness:.2});
function RB(w,h,d,r){r=Math.max(.002,Math.min(r,w/2-.001,h/2-.001,d/2-.001));const g=new THREE.BoxGeometry(w,h,d,2,2,2),p=g.attributes.position,n=g.attributes.normal,v=new THREE.Vector3(),c=new THREE.Vector3(),a=w/2-r,b=h/2-r,e=d/2-r;for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);c.set(clamp(v.x,-a,a),clamp(v.y,-b,b),clamp(v.z,-e,e));v.sub(c);if(v.lengthSq()<1e-12)continue;v.normalize();n.setXYZ(i,v.x,v.y,v.z);p.setXYZ(i,c.x+v.x*r,c.y+v.y*r,c.z+v.z*r)}return g}

/* ---------- procedural textures ---------- */
function cv(fn,s,h){const c=document.createElement('canvas');c.width=s||256;c.height=h||s||256;fn(c.getContext('2d'),c.width,c.height);return c}

function undo(){if(hi>0){hi--;loadState(hist[hi],true);try{localStorage.setItem('hd3d.v1',hist[hi])}catch(e){}}}

 if(t.dataset.pf){setF(t.dataset.pf,t.dataset.c);const o=sel(),inp=P.querySelector('input[type=color][data-f="'+t.dataset.pf+'"]');if(inp&&o)inp.value=o[t.dataset.pf];commit();return}
 if(t.dataset.v!==undefined){setF(t.dataset.f,t.dataset.v);renderProps();commit();return}
 act(t.dataset.act)});
function act(a){const o=sel();if(a==='dup')dupSel();else if(a==='rot')rotSel(90);else if(a==='del')delSel();else if(a==='focus'&&o)focusObj(o);else if(a==='walk'&&o)walkHere(o);else if(a==='props')togglePanel('props')}
$('#fab').addEventListener('click',function(e){const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;if(a==='rot')rotSel(45);else act(a)});

/* ---------- catalog ---------- */
let curCat='struct',query='';const THUMB={};let TR,TS,TC;
function thumb(k){if(THUMB[k])return THUMB[k];
 if(!TR){TR=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});TR.setSize(160,160);TR.setPixelRatio(1);TS=new THREE.Scene();TS.add(new THREE.HemisphereLight('#ffffff','#9a8f80',.9));const d=new THREE.DirectionalLight('#ffffff',.7);d.position.set(3,6,5);TS.add(d);TC=new THREE.PerspectiveCamera(32,1,.1,100)}
 const o=newObj(k);o._thumb=true;const g=new THREE.Group();try{I[k].build(H(g,o),o)}catch(err){return''}TS.add(g);
 const b=new THREE.Box3().setFromObject(g),c=b.getCenter(new THREE.Vector3()),s=b.getSize(new THREE.Vector3()),r=Math.max(s.x,s.y,s.z,.3)*.5,dist=r/Math.tan(PI/180*16)*1.2;
 TC.position.set(c.x+dist*.55,c.y+dist*.45,c.z+dist*.75);TC.lookAt(c);TR.render(TS,TC);const u=TR.domElement.toDataURL();TS.remove(g);g.traverse(function(n){if(n.geometry)n.geometry.dispose()});THUMB[k]=u;return u}
function renderCats(){$('#cats').innerHTML=CATS.map(function(c){return '<button class="chip2'+(c.id===curCat&&!query?' on':'')+'" data-cat="'+c.id+'">'+c.i+' '+c.n+'</button>'}).join('')}
let thumbQ=0;
function renderGrid(){const q=query.trim();const list=Object.keys(I).filter(function(k){return q?I[k].n.indexOf(q)>-1:I[k].cat===curCat});
 $('#grid').innerHTML=list.map(function(k){return '<button class="card" data-k="'+k+'"><img alt="" '+(THUMB[k]?'src="'+THUMB[k]+'"':'')+'><span>'+I[k].n+'</span></button>'}).join('')||'<div class="empty">لا توجد نتائج</div>';
 const imgs=[...document.querySelectorAll('#grid .card img:not([src])')];const id=++thumbQ;let i=0;
 (function step(){if(id!==thumbQ||i>=imgs.length)return;const img=imgs[i++];const u=thumb(img.parentNode.dataset.k);if(u)img.src=u;setTimeout(step,0)})()}
$('#cats').addEventListener('click',function(e){const b=e.target.closest('[data-cat]');if(!b)return;curCat=b.dataset.cat;query='';$('#q').value='';renderCats();renderGrid()});
$('#q').addEventListener('input',function(e){query=e.target.value;renderCats();renderGrid()});
$('#grid').addEventListener('click',function(e){const b=e.target.closest('[data-k]');if(!b)return;addObj(b.dataset.k);if(matchMedia('(max-width:1000px)').matches)$('#catalog').classList.remove('open')});
$('#mainTabs').addEventListener('click',function(e){const b=e.target.closest('[data-t]');if(!b)return;document.querySelectorAll('#mainTabs button').forEach(function(x){x.classList.toggle('on',x===b)});$('#tabItems').hidden=b.dataset.t!=='items';$('#tabHouse').hidden=b.dataset.t!=='house';$('#tabTpl').hidden=b.dataset.t!=='tpl'});

/* ---------- house tab ---------- */
function setHouse(p){const oh=HS.H;Object.assign(HS,p);buildShell();if(p.H!==undefined&&p.H!==oh)OBJS.forEach(function(o){if(I[o.t].dep)rebuild(o);else applyT(o)});if(p.W!==undefined||p.D!==undefined)frameHouse()}
function renderHouse(){const el=$('#tabHouse');
 el.innerHTML='<h4>أبعاد المنزل</h4>'+rng('hW','العرض',4,24,.5,HS.W,' م')+rng('hD','العمق',4,24,.5,HS.D,' م')+rng('hH','ارتفاع الأسقف',2.4,4.5,.1,HS.H,' م')
 +'<h4>الوقت (إضاءة الشمس)</h4>'+rng('hT','الساعة',0,24,.5,HS.time,'')
 +'<h4>أرضية المنزل</h4><div class="swg">'+Object.keys(FLOORS).map(function(k){return '<button class="sw'+(HS.floor===k?' on':'')+'" data-hf="'+k+'"><img alt="" src="'+swatch(k)+'"><span>'+FLOORS[k].n+'</span></button>'}).join('')+'</div>'
 +'<h4>نمط الجدران</h4><div class="swg">'+Object.keys(WALLS).map(function(k){return '<button class="sw'+(HS.wallStyle===k?' on':'')+'" data-hw="'+k+'"><img alt="" src="'+wswatch(k,HS.wallColor)+'"><span>'+WALLS[k].n+'</span></button>'}).join('')+'</div>'
 +'<h4>لون الجدران</h4>'+palHtml('hwc',HS.wallColor)+'<h4>لون السقف</h4>'+palHtml('hcc',HS.ceilColor)
 +'<h4>خيارات</h4><label class="chk"><input type="checkbox" data-ho="door" '+(HS.door?'checked':'')+'> باب رئيسي في الواجهة الجنوبية</label><label class="chk"><input type="checkbox" data-ho="garden" '+(HS.garden?'checked':'')+'> حديقة خضراء حول المنزل</label><label class="chk"><input type="checkbox" data-ho="cut" '+(HS.cut?'checked':'')+'> قص الجدران الأمامية (منظر البيت المفتوح)</label><label class="chk"><input type="checkbox" data-ho="ceilOn" '+(HS.ceilOn?'checked':'')+'> إظهار السقف في العرض الخارجي</label><label class="chk"><input type="checkbox" data-ho="snap" '+(HS.snap?'checked':'')+'> محاذاة القطع للشبكة</label>'}
const HT=$('#tabHouse');
HT.addEventListener('input',function(e){const t=e.target;if(t.type==='range'){const b=t.parentNode.querySelector('b'),u=t.dataset.u||'';b.textContent=fmt(+t.value)+u;const v=parseFloat(t.value);if(t.dataset.f==='hW')setHouse({W:v});if(t.dataset.f==='hD')setHouse({D:v});if(t.dataset.f==='hH')setHouse({H:v});if(t.dataset.f==='hT')setHouse({time:v})}
 else if(t.type==='color'){if(t.dataset.f==='hwc')setHouse({wallColor:t.value});if(t.dataset.f==='hcc')setHouse({ceilColor:t.value})}});
HT.addEventListener('change',function(e){const t=e.target;if(t.dataset.ho){setHouse(Object.fromEntries([[t.dataset.ho,t.checked]]));commit()}else if(t.type==='range'||t.type==='color')commit()});
HT.addEventListener('click',function(e){const t=e.target.closest('[data-hf],[data-hw],[data-pf]');if(!t)return;
 if(t.dataset.hf)setHouse({floor:t.dataset.hf});else if(t.dataset.hw)setHouse({wallStyle:t.dataset.hw});else{if(t.dataset.pf==='hwc')setHouse({wallColor:t.dataset.c});else setHouse({ceilColor:t.dataset.c})}renderHouse();commit()});
function renderTpl(){$('#tabTpl').innerHTML='<p class="dim">اختر قالباً جاهزاً ثم عدّل فيه كما تشاء (يمكنك التراجع دائماً).</p>'+TPL.map(function(t,i){return '<button class="tpl" data-i="'+i+'"><i>'+t.i+'</i><span><b>'+t.n+'</b><small>'+t.d+'</small></span></button>'}).join('')+'<div class="btns"><button class="btn dng" id="clearAll">🗑 مسح كل القطع</button></div>'}
$('#tabTpl').addEventListener('click',function(e){const b=e.target.closest('.tpl');if(b){loadTpl(+b.dataset.i);if(matchMedia('(max-width:1000px)').matches)$('#catalog').classList.remove('open');return}
 if(e.target.id==='clearAll'){loadState({H:HS,o:[]});commit();toast('تم مسح القطع — يمكنك التراجع')}});

/* ---------- header buttons ---------- */
function togglePanel(id){const el=$('#'+id);if(matchMedia('(max-width:1000px)').matches){const other=$(id==='props'?'#catalog':'#props');other.classList.remove('open');el.classList.toggle('open')}else el.classList.toggle('hide');setTimeout(resize,30)}
$('#bCat').onclick=function(){togglePanel('catalog')};$('#bProps').onclick=function(){togglePanel('props')};
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;$('#bNight').onclick=toggleNight;
$('#bTheme').onclick=function(){const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark'};
$('#bShot').onclick=function(){const was=selBox.visible;selBox.visible=false;renderer.render(scene,camera);const u=canvas.toDataURL('image/png');selBox.visible=was;openModal('<h3>📷 لقطة من تصميمك</h3><img alt="لقطة التصميم" src="'+u+'"><p class="dim">اضغط مطولاً على الصورة (أو زر الفأرة الأيمن) ثم احفظها.</p><div class="btns"><button class="btn pri" data-close>إغلاق</button></div>')};
$('#bIO').onclick=function(){openModal('<h3>💾 الحفظ والتصدير</h3><p class="dim">يُحفظ تصميمك تلقائياً في هذا المتصفح. لنقله لجهاز آخر انسخ الكود أدناه، وللاستعادة الصقه واضغط استيراد.</p><textarea id="ioTxt" spellcheck="false">'+snap().replace(/</g,'&lt;')+'</textarea><div class="btns"><button class="btn pri" id="ioCopy">نسخ الكود</button><button class="btn" id="ioLoad">استيراد</button><button class="btn" data-close>إغلاق</button></div>')};
$('#modalBox').addEventListener('click',function(e){if(e.target.id==='ioCopy'){const t=$('#ioTxt');t.select();try{navigator.clipboard.writeText(t.value).then(function(){toast('تم النسخ')},function(){document.execCommand('copy');toast('تم النسخ')})}catch(x){document.execCommand('copy');toast('تم النسخ')}}
 if(e.target.id==='ioLoad'){if(loadState($('#ioTxt').value)){commit();closeModal();toast('تم الاستيراد')}}});
$('#bHelp').onclick=function(){openModal('<h3>❓ كيف أستخدم المصمم؟</h3><ul><li><b>أضف</b> من قائمة العناصر (أكثر من 90 قطعة بصور ثلاثية الأبعاد) ثم <b>اسحبها</b> لتحريكها.</li><li>انقر على القطعة لتعديل <b>لونها وحجمها ودورانها وارتفاعها</b> وإضاءتها.</li><li>تبويب <b>المنزل</b>: الأبعاد، الأرضيات، الجدران، السقف، الحديقة، وساعة اليوم.</li><li>تبويب <b>قوالب</b>: صالة، غرفة نوم، مطبخ، شقة كاملة، ومجلس عربي.</li><li><b>جولة داخلية 🚶</b>: امشِ داخل البيت بـ WASD أو العصا، واسحب للنظر، والعجلة للتقريب. زر «شاهد من هنا» يضعك أمام القطعة المحددة.</li><li><b>جدار فاصل</b> مع «فتحة باب» لتقسيم الغرف، و«منطقة أرضية» لتغيير أرضية غرفة بعينها.</li><li>اختصارات: R تدوير، Ctrl+D تكرار، Delete حذف، F تقريب، Ctrl+Z تراجع، 1/2/3 أنماط العرض، الأسهم لتحريك القطعة.</li><li>النوافذ والأبواب الجاهزة تُركَّب على سطح الجدار؛ للفتحة الحقيقية استخدم الجدار الفاصل أو الباب الرئيسي.</li></ul><div class="btns"><button class="btn pri" data-close>فهمت</button></div>')};
document.querySelectorAll('#modes button').forEach(function(b){b.onclick=function(){setMode(b.dataset.m)}});
function goFull(){try{const d=document.documentElement;const p=d.requestFullscreen?d.requestFullscreen():Promise.reject();Promise.resolve(p).then(function(){return screen.orientation&&screen.orientation.lock?screen.orientation.lock('landscape'):0}).catch(function(){})}catch(x){}}
$('#bFull').onclick=goFull;
if(matchMedia('(pointer: coarse)').matches){window.addEventListener('pointerdown',function f(){window.removeEventListener('pointerdown',f);goFull()},{once:true});try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(function(){})}catch(x){}}
if(rotMQ.matches)setTimeout(function(){toast('تم تدوير الشاشة تلقائياً للعرض الأفقي 📱↔️')},800);

/* ---------- init ---------- */
renderCats();renderGrid();renderHouse();renderTpl();renderProps();
if(matchMedia('(max-width:1000px)').matches){/* panels start closed on phones */}
let loaded=false;try{const s=localStorage.getItem('hd3d.v1');if(s)loaded=loadState(s)}catch(e){}
if(!loaded){loadTpl(0)}else{hist=[snap()];hi=0;frameHouse()}
if(!hist.length){hist=[snap()];hi=0}
cam.r=goal.r;setMode('orbit');updateHint();resize();requestAnimationFrame(loop);
})();
